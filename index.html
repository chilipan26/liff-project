<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案件管理</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 18px;
      background: #f6f7f9;
      font-size: 18px;
      line-height: 1.6;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 16px;
    }

    h3 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      font-size: 18px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    textarea {
      min-height: 110px;
    }

    button {
      background: #06c755;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 18px;
    }

    .memo-box {
      background: #fff8dc;
      border-left: 6px solid #f5b400;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 17px;
    }

    .result-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      margin: 12px 0;
      border: 1px solid #ddd;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <h2>案件管理</h2>

  <div class="card">
    <button onclick="showCreate()">新規登録</button>
    <button onclick="showSearch()">案件検索・訂正</button>
  </div>

  <div id="createArea" class="card hidden">

    <h3>新規案件登録</h3>

    <div class="memo-box">
      <b>案件原文・LINE内容</b><br>
      LINEで来た案件文や注意事項を貼り付けてください。
    </div>

    <textarea id="originalText" placeholder="案件原文・LINE内容を貼り付け"></textarea>

    <label>勤務日</label>
    <input id="workDate" type="date">

    <input id="projectName" placeholder="案件名">

    <input id="placeName" placeholder="現場名">

    <input id="address" placeholder="現場住所">

    <label>集合時間</label>
    <input id="meetTime" type="time">

    <label>開始時間</label>
    <input id="startTime" type="time">

    <label>終了時間</label>
    <input id="endTime" type="time">

    <input id="people" type="number" placeholder="人数">

    <input id="client" placeholder="請求先">

    <input id="billingGroup" placeholder="請求グループ">

    <input id="priceType" placeholder="単価区分">

    <input id="manager" placeholder="担当者">

    <textarea id="memo" placeholder="備考"></textarea>

    <button onclick="createProject()">登録する</button>

  </div>

  <div id="searchArea" class="card hidden">
    <h3>案件検索・訂正</h3>

    <input id="keyword" placeholder="案件名・日付・現場名で検索">

    <button onclick="searchProject()">検索</button>

    <div id="results"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwjbPtu-67Rtgb2kc6aEJJ_uQUuJk_3349F3eYirzifT2NTNRrH5Fi_K9Ae6_40F6_THg/exec";

    function showCreate() {
      document.getElementById("createArea").classList.remove("hidden");
      document.getElementById("searchArea").classList.add("hidden");
    }

    function showSearch() {
      document.getElementById("searchArea").classList.remove("hidden");
      document.getElementById("createArea").classList.add("hidden");
    }

    async function createProject() {
      const data = {
        action: "create",
        originalText: originalText.value,
        workDate: workDate.value,
        projectName: projectName.value,
        placeName: placeName.value,
        address: address.value,
        meetTime: meetTime.value,
        startTime: startTime.value,
        endTime: endTime.value,
        people: people.value,
        client: client.value,
        billingGroup: billingGroup.value,
        priceType: priceType.value,
        manager: manager.value,
        memo: memo.value,
        updatedBy: "管理者"
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });

        const json = await res.json();

        if (json.ok) {
          alert("登録しました：" + json.projectId);
        } else {
          alert("登録失敗：" + json.message);
        }
      } catch (error) {
        alert("通信エラー：" + error.message);
      }
    }

    async function searchProject() {
      const box = document.getElementById("results");
      box.innerHTML = "検索中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "search",
            keyword: keyword.value
          })
        });

        const json = await res.json();
        box.innerHTML = "";

        if (!json.results || json.results.length === 0) {
          box.innerHTML = "<p>該当案件がありません。</p>";
          return;
        }

        json.results.forEach(item => {
          const div = document.createElement("div");
          div.className = "result-card";

          div.innerHTML = `
            <b>${item["案件名"] || ""}</b><br>
            勤務日：${item["勤務日"] || ""}<br>
            現場：${item["現場名"] || ""}<br>
            集合：${item["集合時間"] || ""}<br>
            開始：${item["開始時間"] || ""}<br>
            終了：${item["終了時間"] || ""}<br>
            人数：${item["人数"] || ""}<br>
            請求先：${item["請求先"] || ""}<br>
            <button onclick='openEdit(${JSON.stringify(item)})'>訂正する</button>
          `;

          box.appendChild(div);
        });

      } catch (error) {
        box.innerHTML = "検索エラー：" + error.message;
      }
    }

    function openEdit(item) {
      const newName = prompt("案件名を訂正", item["案件名"] || "");
      if (newName === null) return;

      const newPlace = prompt("現場名を訂正", item["現場名"] || "");
      if (newPlace === null) return;

      const newPeople = prompt("人数を訂正", item["人数"] || "");
      if (newPeople === null) return;

      updateProject(item["案件ID"], {
        "案件名": newName,
        "現場名": newPlace,
        "人数": newPeople
      });
    }

    async function updateProject(projectId, updates) {
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "update",
            projectId: projectId,
            updates: updates,
            reason: "LIFFから訂正",
            updatedBy: "管理者"
          })
        });

        const json = await res.json();

        if (json.ok) {
          alert("訂正しました");
          searchProject();
        } else {
          alert("訂正失敗：" + json.message);
        }
      } catch (error) {
        alert("通信エラー：" + error.message);
      }
    }
  </script>

</body>
</html>
